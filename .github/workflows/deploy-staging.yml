name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install and Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: web/dist/

  deploy:
    needs: build
    uses: llm-case-studies/ionos-4c8g-production/.github/workflows/deploy-ionos-reusable.yml@main
    with:
      app_name: edge-kite
      environment: staging
      domain: staging.edge-kite.com
      artifact_name: build
    secrets: inherit
